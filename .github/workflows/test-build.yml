name: Manual Build Windows ARM64
on:
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  build:
    name: Build Bun Windows ARM64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          # 切换到 master 以匹配 Bun 开发分支的最新 API 要求
          version: master 

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Bun (Native ARM64)
        run: |
          # 使用 aarch64-windows-msvc 目标进行编译
          # --summary all 会在日志中列出所有输出文件的位置
          zig build -Dtarget=aarch64-windows-msvc -Doptimize=ReleaseFast --summary all

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-windows-arm64-binary
          # 如果 zig-out/bin/bun.exe 找不到，请查看 Action 日志中的 "install" 部分确认路径
          path: |
            zig-out/bin/bun.exe
            packages/bun-windows-arm64/bun.exe
          if-no-files-found: warn
