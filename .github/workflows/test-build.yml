name: Manual Build Windows ARM64
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Bun Windows ARM64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Zig Nightly (x64 for Cross-Compile)
        shell: pwsh
        run: |
          # 使用 0.16.0-dev 的 x86_64 版本，因为 GitHub Runner 是 x64 的
          $zigUrl = "https://ziglang.org/builds/zig-windows-x86_64-0.16.0-dev.2535+b5bd49460.zip"
          Write-Host "Downloading Zig from $zigUrl..."
          Invoke-WebRequest -Uri $zigUrl -OutFile zig.zip
          
          Write-Host "Extracting Zig..."
          Expand-Archive -Path zig.zip -DestinationPath .
          
          $zigDir = Get-ChildItem -Directory -Filter "zig-windows-x86_64-*" | Select-Object -First 1
          $fullPath = Join-Path (Get-Location) $zigDir.Name
          
          Write-Host "Adding $fullPath to PATH..."
          echo "$fullPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Zig Version
        run: zig version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Bun (Native ARM64)
        run: |
          # 限制并行任务为 1，防止 7GB 内存溢出
          # 目标明确指向 aarch64-windows-msvc
          zig build -Dtarget=aarch64-windows-msvc -Doptimize=ReleaseFast --summary all -j 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-windows-arm64-binary
          path: |
            zig-out/bin/bun.exe
            packages/bun-windows-arm64/bun.exe
          if-no-files-found: warn
